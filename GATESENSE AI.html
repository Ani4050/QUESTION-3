<style>
:root{--bg:#0a1226;--p:#111c33;--p2:#162340;--b:#25345a;--ac:#3b82f6;--bl:#38bdf8;--g:#22c55e;--r:#ef4444;--t:#e8eefc;--m:#8fa1c4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:210px;flex:none;background:#0d1730;border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;letter-spacing:.5px;padding:4px 10px 14px;font-size:16px}.logo b{color:var(--bl)}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--m);padding:10px;border-radius:9px;font:inherit;cursor:pointer;text-align:left}
.nav:hover{background:var(--p2);color:var(--t)}.nav.on{background:#1b3a73;color:#fff;box-shadow:inset 3px 0 var(--bl)}
.main{flex:1;min-width:0;padding:22px 26px 40px;max-width:1100px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px;color:var(--bl)}
.sub{color:var(--m);margin:0 0 18px}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.grid .card{margin:0}
.stat{font-size:28px;font-weight:800}.lbl{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.o{background:transparent;border:1px solid var(--b);color:var(--t)}

.tt{border-collapse:collapse;width:100%;font-family:ui-monospace,Menlo,monospace}
.tt th{color:var(--m);text-align:center;border-bottom:1px solid var(--b);padding:7px;font-size:13px}.tt td{text-align:center;padding:6px;border-bottom:1px solid #1c2a4a}
.bit{display:inline-block;min-width:30px;border-radius:6px;padding:1px 9px;font-weight:700}.b1{background:#14532d;color:#86efac}.b0{background:#4c1d24;color:#fca5a5}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;border:1px solid}
.ok{color:#86efac;border-color:#166534;background:#0f2d1c}.bad{color:#fca5a5;border-color:#7f1d1d;background:#2f1219}.warn{color:#fcd34d;border-color:#78560f;background:#2c2208}
.sym{background:#0b1220;border:1px solid var(--b);border-radius:12px;padding:8px;max-width:480px}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useMemo}=React,h=React.createElement;

/* ---------- Deterministic Boolean engine (independent gate functions) ---------- */
const G={
 AND:{n:2,f:(a,b)=>a&b,eq:"Y = A·B",x:"0001",d:"Output is HIGH only when every input is HIGH."},
 OR:{n:2,f:(a,b)=>a|b,eq:"Y = A+B",x:"0111",d:"Output is HIGH when at least one input is HIGH."},
 NOT:{n:1,f:a=>a?0:1,eq:"Y = A'",x:"10",d:"Output is the inverse of the single input."},
 NAND:{n:2,f:(a,b)=>(a&b)?0:1,eq:"Y = (A·B)'",x:"1110",d:"Output is LOW only when every input is HIGH."},
 NOR:{n:2,f:(a,b)=>(a|b)?0:1,eq:"Y = (A+B)'",x:"1000",d:"Output is HIGH only when every input is LOW."},
 XOR:{n:2,f:(a,b)=>a^b,eq:"Y = A⊕B",x:"0110",d:"Output is HIGH when the inputs differ."},
 XNOR:{n:2,f:(a,b)=>(a^b)?0:1,eq:"Y = (A⊕B)'",x:"1001",d:"Output is HIGH when the inputs are equal."}
};
const NAMES=Object.keys(G);
const combos=g=>G[g].n==1?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]];
const rowsOf=g=>combos(g).map(r=>({in:r,y:G[g].f(...r)}));
/* Verification compares gate functions with hard-coded expected tables (G[g].x) */
function runTests(){
 const gates=NAMES.map(g=>{const rows=combos(g).map((r,i)=>{const act=G[g].f(...r),exp=+G[g].x[i];return{in:r,exp,act,ok:act===exp}});return{g,rows,pass:rows.filter(r=>r.ok).length}});
 const total=gates.reduce((s,x)=>s+x.rows.length,0),passed=gates.reduce((s,x)=>s+x.pass,0);
 return{gates,total,passed,failed:total-passed};
}

/* ---------- Standard gate symbols as SVG string (also used for export) ---------- */
function svgOf(g,a=0,b=0){
 const c=G[g],y=c.f(a,b),col=v=>v?"#22c55e":"#64748b",bub=["NAND","NOR","XNOR","NOT"].includes(g),ex=g=="NOT"?130:140,ox=bub?ex+12:ex;
 const wx={AND:60,NAND:60,OR:64,NOR:64,XOR:54,XNOR:54,NOT:60}[g];
 const body=g=="NOT"?"M60 25L60 95L130 60Z":g.endsWith("AND")?"M60 20H100A40 40 0 0 1 100 100H60Z":"M55 20Q95 20 140 60Q95 100 55 100Q80 60 55 20Z";
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" role="img" aria-label="${g} gate circuit"><rect width="240" height="120" fill="#0b1220"/><g fill="none" stroke-width="3" stroke-linecap="round">`;
 (c.n==2?[[40,a,"A"],[80,b,"B"]]:[[60,a,"A"]]).forEach(([yy,v,l])=>{s+=`<path d="M12 ${yy}H${wx}" stroke="${col(v)}"/><circle cx="12" cy="${yy}" r="4" fill="${col(v)}" stroke="none"/><text x="22" y="${yy-7}" fill="#cbd5e1" stroke="none" font-size="12" font-family="monospace">${l}=${v}</text>`});
 s+=`<path d="${body}" stroke="#38bdf8" fill="#12203d" stroke-linejoin="round"/>`;
 if(g=="XOR"||g=="XNOR")s+=`<path d="M45 20Q70 60 45 100" stroke="#38bdf8"/>`;
 if(bub)s+=`<circle cx="${ex+6}" cy="60" r="6" stroke="#38bdf8" fill="#0b1220" stroke-width="2.5"/>`;
 s+=`<path d="M${ox} 60H212" stroke="${col(y)}"/><circle cx="214" cy="60" r="4" fill="${col(y)}" stroke="none"/><text x="196" y="50" fill="#cbd5e1" stroke="none" font-size="12" font-family="monospace">Y=${y}</text><text x="100" y="114" fill="#38bdf8" stroke="none" font-size="11" text-anchor="middle" font-family="monospace">${g}</text></g></svg>`;
 return s;
}

/* ---------- Small reusable components ---------- */
const P={dash:"M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",id:"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z",tt:"M3 3h18v18H3zM3 9h18M3 15h18M9 3v18",ci:"M6 6h12v12H6zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4",sw:"M7 7h10a5 5 0 0 1 0 10H7A5 5 0 0 1 7 7zM17 12h.01",ver:"M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5zM9 12l2 2 4-4",doc:"M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4zM4 16a4 4 0 0 1 4-4h12",dl:"M12 3v12M7 10l5 5 5-5M4 21h16"};
const Icon=({p})=>h("svg",{width:18,height:18,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round","aria-hidden":true},h("path",{d:p}));
const Bit=({v,w})=>h("span",{className:"bit "+(v?"b1":"b0")},v,w?(v?" HIGH":" LOW"):"");
const Sym=({g,a,b})=>h("div",{className:"sym",dangerouslySetInnerHTML:{__html:svgOf(g,a,b)}});
const GateSel=({g,set})=>h("div",{className:"row"},NAMES.map(n=>h("button",{key:n,className:"chip"+(n==g?" on":""),onClick:()=>set(n)},n)));
const TT=({g})=>h("table",{className:"tt"},h("thead",null,h("tr",null,(G[g].n==2?["A","B"]:["A"]).map(x=>h("th",{key:x},x)),h("th",null,"Y"))),
 h("tbody",null,rowsOf(g).map((r,i)=>h("tr",{key:i},r.in.map((v,j)=>h("td",{key:j},h(Bit,{v}))),h("td",null,h(Bit,{v:r.y,w:1}))))));
const Switch=({l,v,set})=>h("div",{style:{textAlign:"center"}},h("div",{className:"lbl"},"Input "+l),
 h("button",{className:"sw",style:{background:v?"#15803d":"#7f1d1d",borderColor:v?"#22c55e":"#ef4444"},"aria-pressed":!!v,"aria-label":"Input "+l+" is "+v+", click to toggle",onClick:()=>set(v?0:1)},v),h("div",{className:"lbl"},v?"HIGH":"LOW"));

/* ---------- Content ---------- */
const DOCS=[
["Logic gates","A logic gate is a digital circuit that maps one or two binary inputs (0 = LOW, 1 = HIGH) to one binary output. This project covers AND, OR, NOT, NAND, NOR, XOR and XNOR."],
["Boolean algebra","Boolean algebra describes gate behaviour with algebraic operators: · (AND), + (OR), ' (NOT) and ⊕ (XOR). Each gate has one equation, e.g. NAND is Y = (A·B)'. De Morgan’s laws relate them: (A·B)' = A'+B' and (A+B)' = A'·B'."],
["Truth tables","A truth table lists every input combination with its output. n inputs give 2ⁿ rows: four rows for each two-input gate and two for NOT, so 6×4 + 2 = 26 test cases in total."],
["NLP classification","Natural-language classification maps free text such as “output is HIGH only when both inputs are HIGH” to a category (a gate). Here the text is classified into one of seven gates or rejected as ambiguous or unsupported."],
["Generative AI","Gate identification is done by Claude-powered AI through the Artifact runtime’s sample capability, with no API key needed. The AI only returns a classification, explanation and confidence. No model name or version is asserted."],
["Circuit construction","Each gate uses a standard symbol: a flat-backed D shape for AND, a curved shield for OR, an extra back arc for XOR, a triangle for NOT, and a small bubble on the output for inversion (NAND, NOR, XNOR, NOT)."],
["Verification","Every gate is run through its own JavaScript function for all input rows and compared with an independently written expected output string. The AI never computes outputs. A gate passes only when all its rows match."]];
const EXAMPLES=["Output is HIGH only when both inputs are HIGH.","The alarm sounds if either door sensor is triggered.","The output is the opposite of the single input.","Output is LOW only when both inputs are HIGH.","Output is HIGH when exactly one of the two inputs is HIGH.","Output is HIGH when the inputs are equal.","The output sometimes goes high."];
const NAMEOF={AND:"AND Gate",OR:"OR Gate",NOT:"NOT Gate (inverter)",NAND:"NAND Gate",NOR:"NOR Gate",XOR:"XOR Gate",XNOR:"XNOR Gate"};
function guide(g){
 const n=G[g].n,two=n==2;
 return{comps:[`${n} × Input pin (label ${two?"A and B":"A"}), 1 bit each`,`1 × ${NAMEOF[g].replace(" (inverter)","")} from the Gates library${g=="NOT"?" (NOT Gate)":""}, ${two?"2 inputs, data bits = 1":"data bits = 1"}`,"1 × Output pin (label Y), 1 bit","Wires between them"],
 steps:[two?"Place two Input pins and set their labels to A and B.":"Place one Input pin and set its label to A.","Place the "+g+" gate from the Gates folder in the Explorer pane.",two?"Wire A to the gate’s upper input and B to its lower input.":"Wire A to the gate’s input.","Place an Output pin labelled Y and wire it to the gate output.","Use the Poke tool to toggle the inputs and read Y for each row.","Compare each Y with the truth table below."]};
}

/* ---------- AI prompt (classification only; never asks for outputs) ---------- */
const PROMPT=t=>`You classify an English description of digital-logic behaviour into exactly one gate. Allowed gates: AND, OR, NOT, NAND, NOR, XOR, XNOR (NOT has one input, the others have two). Do NOT produce truth tables. Be strict: if the description is vague, contradictory, uses more than two inputs, describes other circuits (latch, flip-flop, adder, multiplexer, counter) or is unrelated to logic, do NOT guess. Reply with JSON only, no markdown: {"status":"identified"|"ambiguous"|"unsupported","gate":"GATE_NAME or null","inputs":["A","B"],"explanation":"at most two sentences","confidence":integer 0-100,"clarification":"question or reason, empty string if identified"}. Description: """${t}"""`;

/* ---------- App ---------- */
function App(){
 const[v,setV]=useState("dash"),[g,setG]=useState("AND"),[a,setA]=useState(0),[b,setB]=useState(0),[txt,setTxt]=useState(""),[ai,setAi]=useState(null),[busy,setBusy]=useState(false),[err,setErr]=useState(""),[msg,setMsg]=useState(""),[run,setRun]=useState(0);
 const res=useMemo(runTests,[run]);
 const toast=m=>{setMsg(m);setTimeout(()=>setMsg(""),3500)};
 const two=G[g].n==2,out=G[g].f(a,two?b:0);
 const save=async(name,data)=>{try{const d=window.claude&&await claude.use("downloads");if(!d)return toast("Downloads are not available in this view.");await d.save({filename:name,data});toast("Export ready: "+name)}catch(e){toast(e&&e.code=="declined"?"Download cancelled.":"Export failed: "+((e&&e.message)||e))}};
 const csv=list=>"Gate,A,B,Y\n"+list.flatMap(n=>rowsOf(n).map(r=>[n,r.in[0],G[n].n==2?r.in[1]:"",r.y].join(","))).join("\n")+"\n";
 const eqTxt=()=>"GATESENSE AI - Boolean equations\n\n"+NAMES.map(n=>`${n.padEnd(5)} ${G[n].eq}${n==g?"   <- selected":""}`).join("\n")+"\n";
 const md=()=>`# GATESENSE AI - Project Summary\n\nDigital Logic Gate Identifier from Natural Language (Digital Electronics project P2)\n\n## Selected gate\n- Gate: ${g}\n- Equation: \`${G[g].eq}\`\n- Meaning: ${G[g].d}\n\n## AI identification (Claude-powered AI)\n${ai&&ai.status=="identified"?`- Input: "${ai.text}"\n- Result: ${ai.gate}, confidence ${ai.conf}%\n- Explanation: ${ai.exp}`:"- No identification has been run in this session."}\n\n## Truth table (${g})\n| ${two?"A | B":"A"} | Y |\n|${two?"---|---":"---"}|---|\n${rowsOf(g).map(r=>"| "+r.in.join(" | ")+" | "+r.y+" |").join("\n")}\n\n## Verification (computed in this session)\n- Total tests: ${res.total}\n- Passed: ${res.passed}\n- Failed: ${res.failed}\n- Status: ${res.failed?"FAIL":"PASS"}\n${res.gates.map(x=>`- ${x.g}: ${x.pass}/${x.rows.length}`).join("\n")}\n\nNote: Logisim comparison is a manual step; Logisim was not executed by this app.\n`;
 const exps={csvSel:["Truth table CSV (selected)",()=>save(`truth-table-${g}.csv`,csv([g]))],csvAll:["Truth table CSV (all 26)",()=>save("truth-table-all.csv",csv(NAMES))],txt:["Equations TXT",()=>save("boolean-equations.txt",eqTxt())],svg:["Circuit SVG",()=>save(`circuit-${g}.svg`,svgOf(g,a,two?b:0))],md:["Summary Markdown",()=>save("gatesense-summary.md",md())]};
 const Exp=({k})=>h("button",{className:"btn o",onClick:exps[k][1]},h(Icon,{p:P.dl}),exps[k][0]);

 async function identify(){
  const t=txt.trim();
  if(t.length<8||!/[a-z]/i.test(t))return setErr("Enter a description of at least 8 characters that contains words.");
  if(t.length>400)return setErr("Keep the description under 400 characters.");
  setErr("");setBusy(true);setAi(null);
  try{
   const s=window.claude&&await claude.use("sample");
   if(!s)throw{code:"unavailable"};
   const r=await s.json(PROMPT(t),{modelTier:"quick",cache:false});
   if(!r||!["identified","ambiguous","unsupported"].includes(r.status))throw{code:"bad",message:"The AI returned an unexpected format."};
   if(r.status=="identified"&&!G[String(r.gate).toUpperCase()])throw{code:"bad",message:"The AI named an unsupported gate."};
   const gate=r.status=="identified"?String(r.gate).toUpperCase():null;
   setAi({status:r.status,gate,text:t,exp:String(r.explanation||"").slice(0,400),conf:Math.max(0,Math.min(100,Math.round(+r.confidence||0))),clar:String(r.clarification||"").slice(0,400),inputs:gate?(G[gate].n==1?["A"]:["A","B"]):[]});
   if(gate){setG(gate);setA(0);setB(0)}
  }catch(e){
   const c=e&&e.code;
   setErr(c=="not_granted"?"Permission to use Claude was declined. Allow it and retry, or choose a gate manually below.":c=="rate_limited"?"Claude is rate limited right now. Wait a moment and try again.":c=="unavailable"?"Claude AI is not available in this view. Open the published artifact in claude.ai, or choose a gate manually below.":"AI request failed: "+((e&&e.message)||"unknown error")+" You can still choose a gate manually.");
  }finally{setBusy(false)}
 }

 const NAV=[["dash","Dashboard",P.dash],["id","Gate Identifier",P.id],["tt","Truth Table",P.tt],["ci","Circuit Visualizer",P.ci],["sw","Logic Tester",P.sw],["ver","Verification",P.ver],["doc","Documentation",P.doc]];
 const head=(t,s)=>h("div",null,h("h1",null,t),h("p",{className:"sub"},s));
 const status=res.failed?h("span",{className:"tag bad"},"FAIL"):h("span",{className:"tag ok"},"ALL PASS");
 const eqBlock=h("div",null,h("div",{className:"eq"},G[g].eq),h("p",{style:{color:"var(--m)"}},G[g].d));
 const Sw=h("div",{className:"row",style:{gap:24}},h(Switch,{l:"A",v:a,set:setA}),two&&h(Switch,{l:"B",v:b,set:setB}),h("div",{style:{textAlign:"center"}},h("div",{className:"lbl"},"Output Y"),h("div",{className:"sw",style:{display:"flex",alignItems:"center",justifyContent:"center",background:out?"#15803d":"#7f1d1d",borderColor:out?"#22c55e":"#ef4444"}},out),h("div",{className:"lbl"},out?"HIGH":"LOW")));

 let view;
 if(v=="dash")view=h("div",null,head("Dashboard","Describe a condition in English, identify the gate, then inspect and verify it."),
  h("div",{className:"grid",style:{marginBottom:16}},
   h("div",{className:"card"},h("div",{className:"lbl"},"Gates supported"),h("div",{className:"stat"},NAMES.length)),
   h("div",{className:"card"},h("div",{className:"lbl"},"Test cases"),h("div",{className:"stat"},res.total)),
   h("div",{className:"card"},h("div",{className:"lbl"},"Passed / failed"),h("div",{className:"stat"},res.passed," / ",res.failed)),
   h("div",{className:"card"},h("div",{className:"lbl"},"Verification status"),h("div",{style:{marginTop:8}},status))),
  h("div",{className:"cols"},
   h("div",{className:"card"},h("h2",null,"Selected gate: "+g),h(GateSel,{g,set:x=>{setG(x);setA(0);setB(0)}}),h("div",{style:{margin:"12px 0"}},eqBlock),h(Sym,{g,a:0,b:0})),
   h("div",{className:"card"},h("h2",null,"AI engine"),h("p",null,"Gate identification uses ",h("b",null,"Claude-powered AI")," through the Artifact runtime. Truth tables, outputs and verification are computed by deterministic JavaScript, never by the AI."),
    h("div",{className:"row",style:{margin:"10px 0"}},h("button",{className:"btn",onClick:()=>setV("id")},"Identify a gate"),h("button",{className:"btn o",onClick:()=>setV("ver")},"View verification")),
    h("h3",null,"Exports"),h("div",{className:"row"},h(Exp,{k:"csvAll"}),h(Exp,{k:"txt"}),h(Exp,{k:"svg"}),h(Exp,{k:"md"})))));
 if(v=="id")view=h("div",null,head("Gate Identifier","Claude-powered AI classifies your description. Ambiguous or unsupported text is rejected, not guessed."),
  h("div",{className:"card"},h("textarea",{value:txt,maxLength:400,placeholder:"e.g. Output is HIGH only when both inputs are HIGH.","aria-label":"Logic condition in plain English",onChange:e=>setTxt(e.target.value)}),
   h("div",{className:"row",style:{margin:"10px 0"}},EXAMPLES.map(x=>h("button",{key:x,className:"chip",onClick:()=>{setTxt(x);setErr("")}},x.length>34?x.slice(0,32)+"…":x))),
   h("div",{className:"row"},h("button",{className:"btn",disabled:busy,onClick:identify},h(Icon,{p:P.id}),busy?"Asking Claude…":"Identify gate"),h("span",{className:"lbl"},txt.trim().length+"/400")),
   err&&h("div",{className:"err",role:"alert"},err)),
